server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static assets: long cache, filenames are content-hashed by CRA.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sitemap is generated dynamically by the backend (includes live blog
    # posts/portfolio projects, not just the static pages) — see
    # @app.get("/sitemap.xml") in backend/server.py. Falls back to the static
    # frontend/public/sitemap.xml file below if this proxy target is ever
    # unreachable or this config isn't the one actually serving the site.
    location = /sitemap.xml {
        proxy_pass http://backend:8001/sitemap.xml;
        proxy_set_header Host $host;
    }

    # React Router: any unknown path falls back to index.html so client-side
    # routing (and deep links like /services/web-development) work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
