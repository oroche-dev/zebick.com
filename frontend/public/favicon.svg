<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <!-- Opening bracket -->
  <path d="M14 20 L8 32 L14 44" stroke="#FF6B00" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Closing bracket -->
  <path d="M50 20 L56 32 L50 44" stroke="#FF6B00" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- z e letters -->
  <text x="32" y="42" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="26" letter-spacing="-1.5" text-anchor="middle" fill="#fff">z<tspan fill="#FF6B00">e</tspan></text>
  <!-- Accent underscore -->
  <rect x="20" y="48" width="24" height="3" rx="1.5" fill="#FF6B00"/>
  <!-- Cursor dot -->
  <rect x="38" y="14" width="4.5" height="4.5" fill="#FF6B00">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
